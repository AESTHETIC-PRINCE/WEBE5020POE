<main>
<section class="panel"><div class="eyebrow">Enquiry</div><h2>Tell us what you need protected.</h2><p class="note">This is a Part 1 HTML form prototype; it is not connected to a live database.</p><form action="#" method="post" class="form-grid">
  <div><label for="name">Full name</label><input type="text" id="name" name="name" required></div>
  <div><label for="email">Email address</label><input type="email" id="email" name="email" required></div>
  <div><label for="phone">Phone number</label><input type="tel" id="phone" name="phone"></div>
  <div><label for="service">Service required</label><select id="service" name="service"><option>Drone surveillance</option><option>VIP / executive protection</option><option>Secure transport</option><option>Armed response</option><option>Site security</option><option>Security consultation</option></select></div>
  <div class="full"><label for="message">Enquiry details</label><textarea id="message" name="message"></textarea></div>
  <div class="full"><button class="btn" type="submit">Submit Enquiry</button></div>
</form></section>
